<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chat Assistant</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #111827;
      --secondary: #1f2937;
      --bubble-user: #2563eb;
      --bubble-ai: #f3f4f6;
      --text: #e5e7eb;
      --dark-text: #111827;
      --muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.2);
      --shadow: 0 20px 40px rgba(15, 23, 42, 0.45);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0b1020, #111827 50%, #1e293b);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      padding: 20px;
    }

    .chat-app {
      width: min(1000px, 100%);
      height: min(90vh, 780px);
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.95);
    }

    .header h1 {
      margin: 0;
      font-size: clamp(1.5rem, 2vw, 2.1rem);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: rgba(15, 23, 42, 0.8);
    }

    .message {
      display: flex;
      max-width: 80%;
      word-break: break-word;
      line-height: 1.6;
    }

    .message.user {
      align-self: flex-end;
      justify-content: flex-end;
    }

    .message.ai {
      align-self: flex-start;
      justify-content: flex-start;
    }

    .bubble {
      border-radius: 18px;
      padding: 14px 16px;
      white-space: pre-wrap;
    }

    .message.user .bubble {
      background: var(--bubble-user);
      color: white;
      border-bottom-right-radius: 6px;
    }

    .message.ai .bubble {
      background: var(--bubble-ai);
      color: var(--dark-text);
      border-bottom-left-radius: 6px;
    }

    .composer {
      border-top: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.95);
      padding: 18px 20px;
    }

    .composer-row {
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      min-height: 60px;
      max-height: 200px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(31, 41, 55, 0.8);
      color: var(--text);
      padding: 14px 16px;
      resize: vertical;
      font: inherit;
    }

    button {
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      color: #082f49;
      font-weight: 700;
      padding: 14px 22px;
      cursor: pointer;
      min-width: 120px;
      font-size: 1rem;
    }

    button:hover {
      opacity: 0.95;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 10px;
      min-height: 18px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .status.error {
      color: #fca5a5;
    }

    @media (max-width: 700px) {
      .message {
        max-width: 92%;
      }

      .composer-row {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="chat-app">
    <div class="header">
      <h1>AI Chat Assistant</h1>
    </div>

    <div id="messages" class="messages">
      <div class="message ai">
        <div class="bubble">Hello! Ask me anything. I can answer questions in Python and provide helpful explanations.</div>
      </div>
    </div>

    <div class="composer">
      <div class="composer-row">
        <textarea id="question" placeholder="Type your question here..."></textarea>
        <button id="sendBtn">Send</button>
      </div>
      <div id="status" class="status"></div>
    </div>
  </div>

  <script>
    const messagesBox = document.getElementById('messages');
    const questionInput = document.getElementById('question');
    const sendBtn = document.getElementById('sendBtn');
    const statusBox = document.getElementById('status');

    function addMessage(text, role) {
      const container = document.createElement('div');
      container.className = `message ${role}`;

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;

      container.appendChild(bubble);
      messagesBox.appendChild(container);
      messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    function setStatus(text, isError = false) {
      statusBox.textContent = text;
      statusBox.classList.toggle('error', isError);
    }

    async function sendQuestion() {
      const question = questionInput.value.trim();
      if (!question) {
        setStatus('Please enter a question.', true);
        return;
      }

      addMessage(question, 'user');
      questionInput.value = '';
      setStatus('Thinking...');
      sendBtn.disabled = true;

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to get answer.');
        }

        addMessage(data.answer || 'No answer returned.', 'ai');
        setStatus('Answer generated.');
      } catch (error) {
        addMessage(error.message || 'Something went wrong.', 'ai');
        setStatus(error.message || 'Error generating answer.', true);
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', sendQuestion);

    questionInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendQuestion();
      }
    });
  </script>
</body>
</html>
